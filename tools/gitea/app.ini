APP_NAME = CineTube Internal Git
RUN_MODE = prod
RUN_USER = mohen
WORK_PATH = C:/gitea

[repository]
ROOT = C:/gitea/data/gitea-repositories
DEFAULT_BRANCH = main

[repository.local]
LOCAL_COPY_PATH = C:/gitea/data/tmp/local-repo

[server]
PROTOCOL = http
DOMAIN = 192.168.0.2
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://192.168.0.2:3000/

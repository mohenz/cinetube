<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>CineTube Exporter</title>
  <style>
    :root {
      --accent: #ff5a5f;
      --accent-hover: #e0484d;
      --background: #121212;
      --surface: #1e1e1e;
      --surface-2: #2d2d2d;
      --text: #e0e0e0;
      --text-muted: #888888;
      --border: #3d3d3d;
      --radius: 6px;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    h1 .badge {
      background-color: var(--accent);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .meta-box {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
    }

    .meta-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .meta-row:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    input {
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      width: calc(100% - 18px);
      box-sizing: content-box;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      background-color: var(--accent);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:disabled {
      background-color: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      text-align: center;
      font-weight: 600;
      min-height: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CineTube Exporter <span class="badge">123AV</span></h1>
  </header>

  <div id="mainContent">
    <div class="meta-box">
      <div class="meta-row">
        <label for="movieCode">품번 (Movie Code)</label>
        <input type="text" id="movieCode">
      </div>
      <div class="meta-row">
        <label for="movieTitle">제목 (Title)</label>
        <input type="text" id="movieTitle">
      </div>
      <div class="meta-row">
        <label for="releaseMonth">출시년월 (Release)</label>
        <input type="text" id="releaseMonth" placeholder="예: 2026-09">
      </div>
      <div class="meta-row">
        <label for="actors">여배우 (Actresses)</label>
        <input type="text" id="actors" placeholder="콤마(,)로 구분">
      </div>
    </div>

    <div class="button-group">
      <button id="sendBtn" disabled>CineTube로 영화 등록</button>
    </div>
  </div>

  <div id="status">페이지 수집 중...</div>

  <script src="popup.js"></script>
</body>
</html>
